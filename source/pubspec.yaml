    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  code_assets: 1.2.1
  flutter_rustore_pay: 11.1.1
  yandex_mobileads: 8.6.0
dev_dependencies:
